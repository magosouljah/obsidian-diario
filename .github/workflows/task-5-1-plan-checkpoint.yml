name: Task 5.1 Plan Checkpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/task-5.1-plan-trigger"

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Patch mandatory Task 5.1 plan records fail-closed
        shell: python
        run: |
          from pathlib import Path

          master = Path("!!!PLAN/Plan Maestro.md")
          phase = Path("!!!PLAN/Fase 0 - Contención e integración.md")
          register = Path("!!!PLAN/Registro de avances.md")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          m = master.read_text(encoding="utf-8")
          m = replace_once(
              m,
              "- **Último avance:** M0-H de expiración natural/server-side de temporary auth queda probado en el draft PR BeatGaler #27, rama `task-5.1-temp-auth-natural-expiry-probe`, head `4ddd6052f0fee7e2b6c82e3f2ebb86610b4c1f3e`. Temp A con TTL de 60 s funcionó antes de `expires_at`; sin reset local, revoke ni rotation, la misma A fue rechazada dos veces después de su expiración natural con `400:TIMEOUT`; una Temp B fresca volvió a funcionar con la misma identidad bot. Workflow dedicado `32895996417`, job `97958708150`, PASS y artefacto `natural-expiry-evidence` digest `sha256:39d0159d6c8cc44a6d06219080aa1b9afc2883033ebd6cf92e553165856cc4a2`. CI normal #193 (`32896306047`) terminó **PASS 6/6**, incluido `Required CI`, Web/shared, supply chain, Windows, macOS arm64 y macOS x86_64. No se tocó runtime productivo, vaults/datos reales ni token rotation/revoke. Esta evidencia retira la expiración natural como incógnita técnica, pero no cierra 5.1 ni cambia el `NO-GO`.",
              "- **Último avance:** la migración productiva + hardening técnico de Tarea 5.1 queda implementada en el draft PR BeatGaler #28, rama `task-5.1-productive-temp-auth-migration`, head `5119b3c6616b1a9c725bca1edad8e39036c4b463`. Web y Desktop usan temporary auth sin entregar `bot_token`, `telegram_api_id`, `telegram_api_hash` ni permanent auth al cliente; el binder controlado serializa imports permanentes frescos y omite `credential_refresh` inseguro cuando falta metadata temporal. Se retiró discovery productivo de `127.0.0.1:4000`, el parser ID3 de navegador queda local, se habilitó CSP, headers API y CORS sin cookies/credentials, y se redujeron scopes FS Tauri. Compile probe #32 (`32909324459`) PASS. CI normal #226 (`32909324476`) terminó **PASS 6/6**, incluido Web/shared con Chrome + guard de `dist`, supply chain, Windows, macOS arm64, macOS x86_64 y `Required CI`. Los tres subitems técnicos de 5.1 pasan a `[ ⚠️ ]`: técnicamente completos, pendientes exclusivamente de revisión/aprobación interna del RO antes de `[x]`. La revisión independiente externa sigue siendo un gate global de release y no se declara realizada.",
              "master last advance",
          )
          m = replace_once(
              m,
              "- **Próximo paso principal:** migrar el runtime productivo Web/Desktop al modelo temporary-auth sin credenciales permanentes compartidas; después cerrar discovery/hardening restante y revisión independiente. **No iniciar Tarea 5.2 todavía.**",
              "- **Próximo paso principal:** revisión interna final del Release Owner sobre Tarea 5.1 (cambios, evidencia y riesgos residuales). Solo con aprobación explícita del RO se marcará 5.1 `[x]`. La revisión independiente externa permanece como gate global previo al release público. **No iniciar Tarea 5.2 todavía.**",
              "master next step",
          )
          old_block = "5.1 no puede aprobarse hasta completar migración productiva sin credencial compartida, discovery/hardening restante y revisión independiente."
          new_block = "la migración productiva y el discovery/hardening técnico de 5.1 ya están completos y con `Required CI` verde; 5.1 permanece sin aprobar únicamente hasta la revisión interna explícita del RO. La revisión independiente externa continúa pendiente como gate global de release y no se sustituye ni se declara completa."
          m = replace_once(m, old_block, new_block, "master blockers")
          evidence_anchor = "M0-H / draft PR #27, head `4ddd6052f0fee7e2b6c82e3f2ebb86610b4c1f3e`: Temp A TTL 60 s funcionó antes de expiry, fue rechazada dos veces tras expiry natural sin reset/revoke/rotation y Temp B fresca restauró la misma identidad; workflow `32895996417` PASS, artefacto `natural-expiry-evidence` digest `sha256:39d0159d6c8cc44a6d06219080aa1b9afc2883033ebd6cf92e553165856cc4a2`; CI normal #193 (`32896306047`) PASS 6/6 incluido `Required CI`. Ningún checkbox 5.1 queda cerrado todavía."
          evidence_new = evidence_anchor.replace(
              "Ningún checkbox 5.1 queda cerrado todavía.",
              "PR #28 `feat(security): migrate productive Direct Web auth to temporary keys`, rama `task-5.1-productive-temp-auth-migration`, head técnico final `5119b3c6616b1a9c725bca1edad8e39036c4b463`: runtime productivo Web/Desktop migrado a temporary auth sin credencial Telegram permanente en cliente; discovery local inseguro retirado del bundle, ID3 local, CSP/headers/CORS/scopes Tauri endurecidos, refresh sin metadata fail-closed y autorización permanente fresca serializada. Compile probe #32 (`32909324459`) PASS y CI normal #226 (`32909324476`) PASS 6/6 incluido `Required CI`. Los tres checkboxes técnicos quedan `[ ⚠️ ]` a la espera de aprobación interna del RO; revisión externa independiente permanece diferida al gate global de release."
          )
          m = replace_once(m, evidence_anchor, evidence_new, "master 5.1 evidence")
          master.write_text(m, encoding="utf-8")

          p = phase.read_text(encoding="utf-8")
          old1 = "- [ 🟡 ] Sustituir credenciales Telegram en cliente por acceso temporal seguro sin romper el data plane directo. **Decisión de diseño en progreso:**"
          new1 = "- [ ⚠️ ] Sustituir credenciales Telegram en cliente por acceso temporal seguro sin romper el data plane directo. **Implementación productiva técnicamente completa; pendiente aprobación interna del RO:**"
          p = replace_once(p, old1, new1, "phase temp auth checkbox")
          p = replace_once(p, "- [ ] Eliminar discovery inseguro de `127.0.0.1:4000`; fijar origen remoto o autenticar criptográficamente el servicio local.", "- [ ⚠️ ] Eliminar discovery inseguro de `127.0.0.1:4000`; fijar origen remoto o autenticar criptográficamente el servicio local. **Técnicamente completo en PR #28; pendiente aprobación interna del RO.**", "phase discovery checkbox")
          p = replace_once(p, "- [ ] Vendorizar parser ID3; definir CSP, headers, CORS, cookie/CSRF y scopes Tauri mínimos.", "- [ ⚠️ ] Vendorizar parser ID3; definir CSP, headers, CORS, cookie/CSRF y scopes Tauri mínimos. **Técnicamente completo en PR #28; pendiente aprobación interna del RO.**", "phase hardening checkbox")
          p = replace_once(p, "**Estado/evidencia 5.1 — en progreso, NO aprobado:**", "**Estado/evidencia 5.1 — técnicamente completo; pendiente revisión/aprobación interna del RO:**", "phase status")
          insertion = """
- PR #28 `feat(security): migrate productive Direct Web auth to temporary keys`, rama `task-5.1-productive-temp-auth-migration`, head final técnico `5119b3c6616b1a9c725bca1edad8e39036c4b463`. Productivo Web y Desktop dejan de recibir credenciales Telegram permanentes: Web genera/bindea temporary auth y el Worker importa solo la key temporal; Desktop usa helper MTProto temporal y el seam Rust pide el binding autenticado a Galer Cloud sin arrancar Local Bot API en el modo temporal. Galer Cloud conserva permanent bot auth únicamente del lado controlado, serializa imports frescos para evitar bursts/FLOOD_WAIT y omite `credential_refresh` cuando no existe metadata temporal segura.
- Hardening de PR #28: el bundle productivo ya no descubre `127.0.0.1:4000` ni acepta un origen Cloud arbitrario recordado; solo proxy same-origin o el origen remoto fijado. El parser ID3 de navegador queda local y el guard inspecciona `dist` para impedir retorno de jsDelivr. Tauri habilita CSP y reduce scopes FS a las operaciones usadas por drop-staging; API añade headers `nosniff`/frame deny/referrer/permissions/CSP y `no-store` en auth/transport. CORS permanece allowlist explícita, bearer-token y sin `Access-Control-Allow-Credentials`, por lo que no se adopta sesión cookie/CSRF.
- Evidencia final técnica: compile probe #32 `32909324459` PASS; CI normal #226 `32909324476` **PASS 6/6**: Web/shared (build, Chrome, typecheck, unit, DOM 56/56, integración 10/10 incluido ID3 local, backend 14/14, regression guard y packaging), Supply chain, Windows, macOS arm64, macOS x86_64 y `Required CI`.
- Gobernanza de cierre: el proyecto tiene un solo maintainer humano. Para esta tarea, el usuario/Release Owner realizará la revisión interna final y debe aprobar explícitamente antes de convertir `[ ⚠️ ]` en `[x]`. Esto **no se denomina revisión independiente**. La revisión independiente externa exigida para security/legal/firma/release sigue pendiente en el gate global y no se declara satisfecha aquí.
"""
          marker = "- Auditoría read-only confirmó que Desktop recibe actualmente `bot_token`, `telegram_api_id` y `telegram_api_hash`;"
          if marker not in p:
              raise SystemExit("phase evidence insertion marker missing")
          p = p.replace(marker, insertion + marker, 1)
          phase.write_text(p, encoding="utf-8")

          r = register.read_text(encoding="utf-8")
          entry = "- **2026-08-25 — Tarea 5.1: migración productiva temporary-auth + hardening técnico completos; pendiente aprobación interna del RO.** Draft PR BeatGaler #28, rama `task-5.1-productive-temp-auth-migration`, head `5119b3c6616b1a9c725bca1edad8e39036c4b463`. Web/Desktop ya no reciben token/API ID/API hash/permanent auth del transport bot; temporary auth se genera/bindea en cliente y permanent auth permanece control-side. Se retiró discovery productivo `127.0.0.1:4000` y origins arbitrarios recordados, ID3 queda local, CSP/headers/CORS/scopes Tauri se endurecieron, refresh sin metadata queda fail-closed y fresh bot auth se serializa. Compile probe #32 (`32909324459`) PASS; CI #226 (`32909324476`) PASS 6/6 incluido `Required CI`, Windows, macOS arm64/x86_64, supply chain y Web/shared con guard de bundle. Los tres checkboxes técnicos quedan `[ ⚠️ ]`, no `[x]`, hasta revisión/aprobación explícita del usuario/RO. La revisión externa independiente sigue siendo gate global de release y no se considera realizada. No se inicia 5.2.\n"
          if entry in r:
              raise SystemExit("register entry already present")
          register.write_text(r.rstrip() + "\n" + entry, encoding="utf-8")

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "BeatGaler Plan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "!!!PLAN/Plan Maestro.md" "!!!PLAN/Fase 0 - Contención e integración.md" "!!!PLAN/Registro de avances.md"
          git diff --cached --check
          git commit -m "docs(plan): record Task 5.1 technical checkpoint"
          git push origin HEAD:main
