name: Task 5.1 Plan Checkpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/task-5.1-plan-trigger"

permissions:
  contents: write

jobs:
  patch-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Patch mandatory Task 5.1 plan records fail-closed
        run: python .github/task-5.1-plan-patch.py

      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "BeatGaler Plan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- "!!!PLAN/Plan Maestro.md" "!!!PLAN/Fase 0 - Contención e integración.md" "!!!PLAN/Registro de avances.md"
          git diff --cached --check
          git commit -m "docs(plan): record Task 5.1 technical checkpoint"
          git push origin HEAD:main
