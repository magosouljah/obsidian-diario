name: Task 5.2 Plan Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task-5.2-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Patch plan evidence
        run: python scripts/task-5.2-plan-sync.py
      - name: Commit synchronized plan evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "plan: sync Task 5.2 implementation evidence"
          git push origin HEAD:main
